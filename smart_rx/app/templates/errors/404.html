{% extends "base.html" %}

{% block title %}Page Not Found (404) · Smart RX{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 col-lg-5 text-center">
    <div class="card card-modern border-0 shadow-lg p-5">
      <div class="brand-icon-box mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem; background: #e0f2fe; color: #0284c7;">
        <i class="bi bi-question-circle"></i>
      </div>
      <h1 class="h4 fw-bold text-dark mb-2">Page Not Found</h1>
      <p class="text-secondary small mb-4">
        The prescription record, order, or page you requested could not be located.
      </p>
      <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('dashboard.home') }}" class="btn btn-primary-custom rounded-pill px-4">
          <i class="bi bi-house-door me-1"></i> Back to Home
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
